services:
  postgres:
    image: postgres:15-alpine
    container_name: gauge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gauge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gauge_password}
      POSTGRES_DB: ${POSTGRES_DB:-gauge_db}
    ports:
      - "5433:5432"
    volumes:
      - gauge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gauge_user} -d ${POSTGRES_DB:-gauge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gauge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-gauge_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gauge_password}
      - POSTGRES_DB=${POSTGRES_DB:-gauge_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gauge_user}:${POSTGRES_PASSWORD:-gauge_password}@postgres:5432/${POSTGRES_DB:-gauge_db}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gauge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    ports:
      - "3001:80"

volumes:
  gauge_pgdata:
    name: gauge_pgdata
